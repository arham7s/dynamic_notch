name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          echo "::notice::Using $X"
          swift --version 2>&1 | head -1 | sed 's/^/::notice::/'
      - name: Build Dynamic Notch.app
        run: |
          set -o pipefail
          ./Scripts/build-app.sh 2>&1 | tee build.log || { grep -E 'error:' build.log | head -25 | sed 's/^/::error::/'; tail -5 build.log | sed 's/^/::error::/'; exit 1; }
      - name: Zip app
        run: ditto -c -k --keepParent "build/Dynamic Notch.app" DynamicNotch-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-macOS
          path: DynamicNotch-macOS.zip
